name: Aerospace Workstation Manager

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - pause
          - destroy

# CRITICAL: Required for OIDC Authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  TF_VAR_aws_region: "us-east-1"

jobs:
  manage-infrastructure:
    name: Execute ${{ inputs.action_type }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. AUTHENTICATE VIA OIDC (No Static Secrets!)
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::315608486737:role/GitHubActions-CFD-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      # 2. GENERATE EPHEMERAL SSH KEY FOR THIS RUN ONLY
      - name: Generate Ephemeral SSH Key
        id: ssh_gen
        run: |
          ssh-keygen -t rsa -b 4096 -f ./ephemeral_key.pem -q -N ""
          chmod 600 ./ephemeral_key.pem
          
          # Export public key for Terraform to ingest
          PUB_KEY=$(cat ./ephemeral_key.pem.pub)
          echo "TF_VAR_public_key_material=$PUB_KEY" >> $GITHUB_ENV

      # 3. TERRAFORM STATE & EXECUTION
      - name: Bootstrap State Bucket
        id: bootstrap
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BUCKET_NAME="aerospace-cfd-state-${OWNER}"
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✅ Bucket exists."
          else
            echo "⚠️ Creating bucket..."
            aws s3 mb s3://$BUCKET_NAME --region us-east-1
            aws s3api put-bucket-versioning --bucket $BUCKET_NAME --versioning-configuration Status=Enabled
          fi
          echo "STATE_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Initialize Terraform
        run: terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"

      - name: Pause Workstation (Destroy Compute, Keep Data)
        if: ${{ inputs.action_type == 'pause' }}
        run: |
          echo "Terminating Spot Instance. Data volume will be preserved."
          terraform destroy -target=aws_instance.cfd_workstation -auto-approve

      - name: Destroy All Infrastructure
        if: ${{ inputs.action_type == 'destroy' }}
        run: terraform destroy -auto-approve

      - name: Apply Infrastructure
        if: ${{ inputs.action_type == 'deploy' }}
        run: terraform apply -auto-approve

      # 4. CONFIGURATION (ANSIBLE)
      - name: Get Connection Details
        if: ${{ inputs.action_type == 'deploy' }}
        id: get_ip
        run: |
          IP=$(terraform output -raw workstation_public_ip)
          echo "INSTANCE_IP=$IP" >> $GITHUB_ENV
          echo "::notice::🚀 Workstation IP: $IP"

      - name: Wait for SSH
        if: ${{ inputs.action_type == 'deploy' }}
        run: |
          echo "Waiting for SSH on ${{ env.INSTANCE_IP }}..."
          timeout 300 bash -c 'until nc -z -v -w5 ${{ env.INSTANCE_IP }} 22; do sleep 5; done'

      - name: Run Ansible Configuration
        if: ${{ inputs.action_type == 'deploy' }}
        run: |
          # Re-added the OpenSSL hash generator we solved earlier!
          HASH=$(openssl passwd -6 "aerospace-student")
          
          ansible-playbook -i "${{ env.INSTANCE_IP }}," \
            --user ubuntu \
            --private-key ephemeral_key.pem \
            --ssh-common-args='-o StrictHostKeyChecking=no' \
            -e "desktop_password_hash=$HASH" \
            playbook.yml