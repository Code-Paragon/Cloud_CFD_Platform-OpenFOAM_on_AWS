---
- name: Configure Aerospace CFD Workstation
  hosts: all
  become: yes
  vars:
    dcv_url: "https://d1uj6qtbmh3dt5.cloudfront.net/nice-dcv-ubuntu2204-x86_64.tgz"

  tasks:
    # ----------------------------------------------------------------
    # 1. NETWORK & FIREWALL (Keep the working redirect)
    # ----------------------------------------------------------------
    - name: Disable UFW entirely
      service:
        name: ufw
        state: stopped
        enabled: no

    - name: Flush existing iptables rules
      command: iptables -F

    - name: Flush NAT table
      command: iptables -t nat -F

    - name: Forward Port 443 to 8443
      command: iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8443

    # ----------------------------------------------------------------
    # 2. MOUNT STORAGE
    # ----------------------------------------------------------------
    - name: Create data directory
      file:
        path: /data
        state: directory
        mode: '0777'

    - name: Format volume
      filesystem:
        fstype: ext4
        dev: /dev/nvme1n1
      ignore_errors: yes

    - name: Mount volume
      mount:
        path: /data
        src: /dev/nvme1n1
        fstype: ext4
        state: mounted

    # ----------------------------------------------------------------
    # 3. INSTALL DESKTOP (No more fake monitors!)
    # ----------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: yes
      retries: 5
      delay: 10

    - name: Install Base Desktop
      apt:
        name:
          - xfce4
          - xfce4-goodies
          - xorg
          - dbus-x11
          - x11-xserver-utils
          - mesa-utils
        state: present

    - name: Configure XFCE to boot in DCV Virtual Session
      copy:
        dest: /home/ubuntu/.xinitrc
        content: |
          #!/bin/sh
          exec startxfce4
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    # ----------------------------------------------------------------
    # 4. OPENFOAM
    # ----------------------------------------------------------------
    - name: Add OpenFOAM Repo
      shell: wget -q -O - https://dl.openfoam.com/add-debian-repo.sh | bash
      args:
        creates: /etc/apt/sources.list.d/openfoam.list

    - name: Install OpenFOAM
      apt:
        name: openfoam2312-default
        state: present

    - name: Add to bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: "source /usr/lib/openfoam/openfoam2312/etc/bashrc"
        create: yes

    # ----------------------------------------------------------------
    # 5. NICE DCV SETUP
    # ----------------------------------------------------------------
    - name: Create DCV folder
      file:
        path: /tmp/dcv
        state: directory

    - name: Download DCV
      unarchive:
        src: "{{ dcv_url }}"
        dest: /tmp/dcv
        remote_src: yes
        extra_opts: [--strip-components=1]

    - name: Install DCV Server
      shell: apt install -y /tmp/dcv/nice-dcv-server_*.deb

    - name: Install DCV Web Viewer
      shell: apt install -y /tmp/dcv/nice-dcv-web-viewer_*.deb

    # ----------------------------------------------------------------
    # 6. USER & PASSWORD
    # ----------------------------------------------------------------
    - name: Set Password
      user:
        name: ubuntu
        password: "{{ desktop_password_hash }}"
        shell: /bin/bash

    - name: Create Simulation Folder
      file:
        path: /home/ubuntu/Desktop/Simulation_Runs
        state: directory
        owner: ubuntu
        group: ubuntu

    # ----------------------------------------------------------------
    # 7. STARTUP SEQUENCE (Using VIRTUAL Session)
    # ----------------------------------------------------------------
    - name: Enable and Restart DCV
      service:
        name: dcvserver
        enabled: yes
        state: restarted

    # CRITICAL FIX: Changed '--type console' to '--type virtual'
    - name: Create DCV Virtual Session
      shell: dcv create-session --type virtual --owner ubuntu cfd-session
      register: dcv_session
      failed_when:
        - dcv_session.rc != 0
        - "'already exists' not in dcv_session.stderr"
      ignore_errors: yes

    # ----------------------------------------------------------------
    # 8. DEBUGGING
    # ----------------------------------------------------------------
    - name: Check Port 8443
      shell: ss -tulpn | grep 8443
      register: port_8443_check
      ignore_errors: yes

    - name: PRINT PORT STATUS
      debug:
        msg: "Server Listener: {{ port_8443_check.stdout }}"